name: Xeno Android Build

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [feature/xeno-candy-browser-reset]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out Xeno
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out pinned Candy sync protocol assets
        uses: actions/checkout@v4
        with:
          repository: sk2andy/candy-browser
          ref: 4d8a2277943b0524e08d86004b495525a074ee18
          path: vendor/candy-protocol
          sparse-checkout: sync/protocol
          sparse-checkout-cone-mode: true

      - name: Restore upstream sync protocol assets
        run: |
          set -euo pipefail
          mkdir -p sync
          cp -R vendor/candy-protocol/sync/protocol sync/
          rm -rf vendor/candy-protocol
          git add sync/protocol
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "port: restore Candy sync protocol assets [skip ci]"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK 37.1
        run: sdkmanager "platforms;android-37.1"

      - name: Run upstream unit tests
        run: ./gradlew testFullDebugUnitTest --no-daemon --stacktrace

      - name: Run Android lint
        run: ./gradlew lintFullDebug --no-daemon --stacktrace

      - name: Build Xeno ARM64 debug APK
        run: ./gradlew assembleFullDebug -Pcandy.releaseAbi=arm64-v8a -Pcandy.compressNativeLibs=true -Pcandy.debugApplicationIdSuffix= -Pcandy.debugAppLabel=Xeno --no-daemon --stacktrace

      - name: Verify APK installability and report size
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/full/debug/app-full-debug.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/aapt"
          unzip -t "$APK" >/dev/null
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='dev.sk2andy.materialbrowser'" apk-badging.txt
          grep -F "application-label:'Xeno'" apk-badging.txt
          cp "$APK" Xeno-arm64-debug.apk
          stat --printf="APK_SIZE_BYTES=%s\\n" Xeno-arm64-debug.apk
          sha256sum Xeno-arm64-debug.apk

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xeno-arm64-installable-apk
          path: Xeno-arm64-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish direct APK download for branch builds
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/xeno-candy-browser-reset'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="xeno-install-test-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" Xeno-arm64-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Xeno install test ${GITHUB_RUN_NUMBER}" \
            --notes "Automated ARM64 debug build. APK signature and package metadata were verified in CI. This is a test build, not a stable release." \
            --prerelease
