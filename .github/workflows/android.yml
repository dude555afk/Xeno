name: Android Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_COMPILE_SDK: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          set -eux
          SDK_DIR="${ANDROID_HOME:-$HOME/android-sdk}"
          mkdir -p "$SDK_DIR/cmdline-tools"

          if [ ! -d "$SDK_DIR/cmdline-tools/latest" ]; then
            curl -sSLo /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            mv /tmp/cmdtools/cmdline-tools "$SDK_DIR/cmdline-tools/latest"
          fi

          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Room schema directory
        run: mkdir -p app/schemas

      # The full Gradle output is captured to a file and committed back on
      # failure. GitHub's own log endpoint requires admin rights, which the API
      # token does not have, so a failed build was previously undiagnosable from
      # here — "Process completed with exit code 1" was the entire error.
      # Committing the log makes it readable through the normal contents API.
      - name: Build debug APK
        id: assemble
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace --info > build-output.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Publish build log on failure
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f build-output.log
          git diff --cached --quiet || git commit -m "ci: build log (exit=${OUTCOME:-unknown})"
          git push origin HEAD:ci-logs || echo "log push failed; log remains local to the run"

      - name: Fail the job if the build failed
        if: steps.assemble.outputs.exit_code != '0'
        run: |
          echo "::error::gradle assembleDebug exited with code ${EXIT_CODE}"
          tail -n 200 build-output.log
          exit 1

      - name: Upload debug APK
        if: steps.assemble.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: xeno-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: xeno-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
