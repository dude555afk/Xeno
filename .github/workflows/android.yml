name: Android Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          set -eu
          SDK_DIR="${ANDROID_HOME:-$HOME/android-sdk}"
          mkdir -p "$SDK_DIR/cmdline-tools"

          if [ ! -d "$SDK_DIR/cmdline-tools/latest" ]; then
            curl -sSLo /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            mv /tmp/cmdtools/cmdline-tools "$SDK_DIR/cmdline-tools/latest"
          fi

          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Room schema directory
        run: mkdir -p app/schemas

      # No continue-on-error, no EXIT_CODE dance, no pipefail tricks.
      #
      # GitHub Actions already runs every `run:` block under `bash -eo pipefail`.
      # Anything added on top of that only creates new ways to be wrong. The
      # previous version used `continue-on-error: true` so a failed build could
      # still reach the log-publishing step, but that silenced the one signal CI
      # exists to give: the job kept reporting "Build debug APK — success" while
      # the APK silently did not exist, and the staging step failed on a cp.
      #
      # Now the build step simply fails. `if: always()` is what lets the log
      # survive a failure, which is the only reason it was there at all.
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.log

      # upload-artifact@v4 resolves its `path` through @actions/glob, which
      # honours .gitignore. `/build/` in .gitignore matches app/build/, so the
      # APK Gradle just produced is invisible to the action even though a shell
      # `find` sees it plainly. Copy somewhere outside the ignored tree first.
      - name: Stage APK for upload
        if: success()
        run: |
          set -eu
          mkdir -p artifacts
          cp -v app/build/outputs/apk/debug/*.apk artifacts/
          ls -la artifacts/

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xeno-debug
          path: artifacts/*.apk
          if-no-files-found: error

      # Always publish, even when the build step above failed. That is the whole
      # point — a broken run is exactly when the log is worth reading.
      - name: Publish build log
        if: always()
        run: |
          set -u
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f build-output.log
          git diff --cached --quiet || git commit -m "ci: build log"
          git push origin HEAD:ci-logs || echo "log push failed"

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Stage release APK for upload
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          mkdir -p artifacts
          cp -v app/build/outputs/apk/release/*.apk artifacts/

      - name: Upload release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: xeno-release
          path: artifacts/*.apk
          if-no-files-found: error
