name: Xeno Android Build

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [feature/xeno-candy-browser-reset]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned Candy Android source (sparse)
        uses: actions/checkout@v4
        with:
          repository: sk2andy/candy-browser
          ref: 4d8a2277943b0524e08d86004b495525a074ee18
          path: vendor/candy-browser
          sparse-checkout: |
            app
            shared
            pocket-runtime
            gradle
            scripts
            distribution
            release-notes
          sparse-checkout-cone-mode: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: vendor/candy-browser/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Install Android 37.1 SDK
        run: sdkmanager "platforms;android-37.1"

      - name: Run upstream browser tests, lint, and build
        working-directory: vendor/candy-browser
        run: ./gradlew testFullDebugUnitTest lintFullDebug assembleFullDebug --no-daemon --stacktrace

      - name: Verify APK output
        run: test -s vendor/candy-browser/app/build/outputs/apk/full/debug/app-full-debug.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xeno-candy-upstream-debug
          path: vendor/candy-browser/app/build/outputs/apk/full/debug/app-full-debug.apk
          if-no-files-found: error
          retention-days: 7
