name: Xeno Android Build

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [feature/xeno-candy-browser-reset]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out Xeno
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out pinned Candy sync protocol assets
        uses: actions/checkout@v4
        with:
          repository: sk2andy/candy-browser
          ref: 4d8a2277943b0524e08d86004b495525a074ee18
          path: vendor/candy-protocol
          sparse-checkout: sync/protocol
          sparse-checkout-cone-mode: true

      - name: Restore upstream sync protocol assets
        run: |
          set -euo pipefail
          mkdir -p sync
          cp -R vendor/candy-protocol/sync/protocol sync/
          rm -rf vendor/candy-protocol
          git add sync/protocol
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "port: restore Candy sync protocol assets [skip ci]"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK 37.1
        run: sdkmanager "platforms;android-37.1"

      - name: Run upstream unit tests
        run: ./gradlew testFullDebugUnitTest --no-daemon --stacktrace

      - name: Run Android lint
        run: ./gradlew lintFullDebug --no-daemon --stacktrace

      - name: Build arm64-only installable APK
        run: ./gradlew assembleFullDebug -Pcandy.releaseAbi=arm64-v8a -Pcandy.compressNativeLibs=true --no-daemon --stacktrace

      - name: Verify and report APK size
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/full/debug/app-full-debug.apk"
          test -s "$APK"
          stat --printf="APK_SIZE_BYTES=%s\n" "$APK"
          sha256sum "$APK"

      - name: Upload arm64 installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xeno-candy-arm64-debug
          path: app/build/outputs/apk/full/debug/app-full-debug.apk
          if-no-files-found: error
          retention-days: 7
