name: Android Build

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, feature/xeno-arc-search-authentic, feature/xeno-arc-search-e2e-rebuild, feature/xeno-gecko-arc-rebuild, feature/xeno-candy-ui]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          set -eu
          SDK_DIR="${ANDROID_HOME:-$HOME/android-sdk}"
          mkdir -p "$SDK_DIR/cmdline-tools"
          if [ ! -d "$SDK_DIR/cmdline-tools/latest" ]; then
            curl -sSLo /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            mv /tmp/cmdtools/cmdline-tools "$SDK_DIR/cmdline-tools/latest"
          fi
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Create Room schema directory
        run: mkdir -p app/schemas

      # Plain `set -e` semantics. No continue-on-error, no EXIT_CODE dance,
      # no hand-rolled pipefail. GitHub already runs `run:` blocks under
      # `bash -eo pipefail`; adding to that only creates new ways to be wrong.
      - name: Run unit tests and build debug APK
        run: |
          set -o pipefail
          gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.log

      # ---------------------------------------------------------------------
      # DiAGNOSTICS: dump everything into the *console* first.
      #
      # The ci-logs branch has been an unreliable diagnostic for three turns:
      # `git push origin HEAD:ci-logs` is a non-fast-forward (ci-logs accumulates
      # commits not in main's history) and was being swallowed by `|| echo`.
      # The log branch went stale and I spent multiple turns reading a dead log.
      #
      # Console output is captured by GitHub in the job summary and is readable
      # without admin rights. This step always runs, always prints, and is the
      # primary diagnostic. The ci-logs push is now best-effort and clearly
      # labelled as such — if it fails, the console has the same content.
      # ---------------------------------------------------------------------
      - name: Dump build result
        if: always()
        run: |
          echo "=== build-output.log: errors ==="
          grep -E "^e:|FAILED|BUILD FAILED|error:" build-output.log | head -100 || echo "(no error lines found — build succeeded)"
          echo ""
          echo "=== APK check ==="
          find . -name "*.apk" -not -path "./.git/*" 2>/dev/null || echo "(no APK found)"
          echo ""
          echo "=== ci-logs push (best-effort, console has same content) ==="

      - name: Stage ARM64 debug APK
        if: success()
        run: |
          set -eu
          mkdir -p artifacts
          APK="app/build/outputs/apk/debug/app-arm64-v8a-debug.apk"
          test -f "$APK"
          cp -v "$APK" artifacts/xeno-arm64-v8a-debug.apk
          du -h artifacts/*.apk

      - name: Upload ARM64 debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xeno-debug-arm64-v8a
          path: artifacts/xeno-arm64-v8a-debug.apk
          if-no-files-found: error

      - name: Stage alternative ABI debug APKs
        if: success()
        run: |
          set -eu
          mkdir -p artifacts-other-abis
          find app/build/outputs/apk/debug -maxdepth 1 -type f -name 'app-*-debug.apk' \
            ! -name 'app-arm64-v8a-debug.apk' -exec cp -v {} artifacts-other-abis/ \;
          test -n "$(find artifacts-other-abis -maxdepth 1 -type f -name '*.apk' -print -quit)"
          du -h artifacts-other-abis/*.apk

      - name: Upload alternative ABI debug APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xeno-debug-other-abis
          path: artifacts-other-abis/*.apk
          if-no-files-found: error

      # Build the optimized variant on branch pushes too, not just release tags,
      # so R8/resource shrinking and APK size can be measured before publishing.
      # This artifact is deliberately unsigned and is for size inspection only.
      - name: Build optimized release APK for size measurement
        if: success() && !startsWith(github.ref, 'refs/tags/v')
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build-release-size.log

      - name: Stage optimized ARM64 release APK (unsigned)
        if: success() && !startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          mkdir -p artifacts-release-size
          APK="app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk"
          test -f "$APK"
          cp -v "$APK" artifacts-release-size/xeno-arm64-v8a-release-unsigned.apk
          echo "=== Optimized ARM64 release APK (unsigned; size-check only) ==="
          stat -c 'APK bytes: %s' artifacts-release-size/xeno-arm64-v8a-release-unsigned.apk
          du -h artifacts-release-size/xeno-arm64-v8a-release-unsigned.apk
          echo "Native libraries are compressed in the APK; Android will extract them during installation."

      - name: Upload optimized ARM64 release APK for size inspection
        if: success() && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: xeno-release-size-arm64-unsigned
          path: artifacts-release-size/xeno-arm64-v8a-release-unsigned.apk
          retention-days: 7
          if-no-files-found: error

      - name: Publish build log (best-effort)
        if: always()
        run: |
          set -u
          # Fetch first, then rebase our new commit on top of ci-logs so the
          # push is a fast-forward. Without this it is rejected every run.
          git fetch origin ci-logs || echo "no ci-logs branch yet"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f build-output.log
          git commit --allow-empty -m "ci: build log (run ${{ github.run_number }})" || true
          if git push origin HEAD:ci-logs --force-with-lease=ci-logs:$(git rev-parse origin/ci-logs 2>/dev/null || echo true) ; then
            echo "ci-logs pushed"
          else
            echo "ci-logs push failed — console output above has the same content"
          fi

      # ---------------------------------------------------------------------
      # RELEASE SIGNING
      #
      # Placement matters: this runs after the debug build and upload so the
      # debug path is byte-identical to what already works. The keystore is
      # decoded here rather than fetched so no signing material ever needs to
      # exist in the repository.
      #
      # The release APKs go to artifacts-release/, not artifacts/. The debug
      # stage above copies from outputs/apk/debug/, and the release build writes
      # to outputs/apk/release/ — pointing the release upload at artifacts/
      # could only ever have failed with "no files found".
      # ---------------------------------------------------------------------
      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::warning::KEYSTORE_BASE64 is not set — the release APK will be UNSIGNED and the verify step will fail. See docs/SIGNING.md."
            exit 0
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > keystore.properties
          echo "release.jks: $(wc -c < release.jks) bytes"
          echo "keystore.properties: $(wc -c < keystore.properties) bytes (passwords not echoed)"

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build-release.log

      - name: Stage ARM64 release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          mkdir -p artifacts-release
          APK="app/build/outputs/apk/release/app-arm64-v8a-release.apk"
          test -f "$APK"
          cp -v "$APK" artifacts-release/xeno-arm64-v8a-release.apk
          du -h artifacts-release/*.apk

      - name: Stage alternative ABI release APKs
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          mkdir -p artifacts-release-other-abis
          find app/build/outputs/apk/release -maxdepth 1 -type f -name 'app-*-release.apk' \
            ! -name 'app-arm64-v8a-release.apk' -exec cp -v {} artifacts-release-other-abis/ \;
          test -n "$(find artifacts-release-other-abis -maxdepth 1 -type f -name '*.apk' -print -quit)"
          du -h artifacts-release-other-abis/*.apk

      - name: Verify release APK signature
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | head -1)"
          if [ -z "${APKSIGNER}" ]; then
            echo "::error::apksigner not found under ${ANDROID_HOME}/build-tools"
            exit 1
          fi
          set -o pipefail
          # Hard gate on purpose. An unsigned APK installs on nothing, and a
          # release that reports success while producing one is worse than no
          # release at all.
          "${APKSIGNER}" verify --print-certs --verbose artifacts-release/*.apk | head -40

      - name: Upload release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: xeno-release-arm64-v8a
          path: artifacts-release/*.apk
          if-no-files-found: error

      - name: Upload alternative ABI release APKs
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: xeno-release-other-abis
          path: artifacts-release-other-abis/*.apk
          if-no-files-found: error
