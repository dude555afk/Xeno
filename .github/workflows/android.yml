name: Xeno browser-core validation

on:
  push:
    branches: [experiment/omni-browser-base]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xeno-browser-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Compile, test, and build Xeno ARM64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source and pinned browser core
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Apply Xeno branding and package
        run: python3 scripts/rebrand_xeno.py browser-core

      - name: Compile and test browser core
        working-directory: browser-core
        run: |
          chmod +x gradlew
          ./gradlew compileUniversalDebugKotlin compileArmDebugKotlin compileAarch64DebugKotlin testUniversalDebugUnitTest assembleAarch64Debug --no-daemon --stacktrace

      - name: Stage ARM64 debug APK
        run: |
          set -eu
          APK="browser-core/app/build/outputs/apk/aarch64/debug/app-aarch64-debug.apk"
          test -f "$APK"
          cp "$APK" xeno-browser-arm64-debug.apk
          sha256sum xeno-browser-arm64-debug.apk
          ls -lh xeno-browser-arm64-debug.apk

      - name: Upload Xeno debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xeno-geckoview-debug-arm64
          path: xeno-browser-arm64-debug.apk
          if-no-files-found: error
          retention-days: 14
