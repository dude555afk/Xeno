name: Xeno Android Build

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [feature/xeno-candy-browser-reset]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out Xeno reset branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out pinned Candy Android source
        uses: actions/checkout@v4
        with:
          repository: sk2andy/candy-browser
          ref: 4d8a2277943b0524e08d86004b495525a074ee18
          path: vendor/candy-browser
          sparse-checkout: |
            app
            shared
            pocket-runtime
            gradle
            scripts
            distribution
            release-notes
            docs/screenshots
            docs
          sparse-checkout-cone-mode: true

      - name: Port Candy Android source into Xeno
        run: |
          set -euo pipefail
          tar --exclude=.git -C vendor/candy-browser -cf /tmp/candy-android-source.tar .
          tar -xf /tmp/candy-android-source.tar -C .
          cp README.md UPSTREAM_README.md
          rm -rf vendor/candy-browser
          git rm --cached --force vendor/candy-browser
          rm -f .gitmodules
          cat > README.md <<'EOF'
          # Xeno Browser

          Xeno is being reset on the complete Android implementation from [Candy Browser](https://github.com/sk2andy/candy-browser).

          ## Imported baseline

          - Upstream repository: https://github.com/sk2andy/candy-browser
          - Pinned upstream revision: `4d8a2277943b0524e08d86004b495525a074ee18`
          - Android app and shared modules are now tracked directly in this repository.
          - Upstream documentation is preserved in `UPSTREAM_README.md` and `docs/`.

          This baseline is intentionally kept close to upstream until its Android build and core browser flows are verified. Branding, application ID, and Xeno-specific features come after that.

          ## Build

          Requirements: JDK 17, Android SDK 37.1, Android 13 (API 33) or newer.

          ```bash
          ./gradlew testFullDebugUnitTest lintFullDebug assembleFullDebug
          ```

          ## License

          The imported upstream source is distributed under the **PolyForm Noncommercial License 1.0.0**. The original `LICENSE`, `LICENSING.md`, and all third-party notices are retained. Use and redistribution are restricted to the purposes permitted by that license unless the upstream licensor grants additional rights.
          EOF
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "port: vendor complete Candy Android browser source [skip ci]"
          git push origin HEAD:refs/heads/feature/xeno-candy-browser-reset

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: platform-tools

      - name: Install Android 37.1 SDK
        run: sdkmanager "platforms;android-37.1"

      - name: Run browser tests, lint, and Android build
        run: ./gradlew testFullDebugUnitTest lintFullDebug assembleFullDebug --no-daemon --stacktrace

      - name: Verify APK output
        run: test -s app/build/outputs/apk/full/debug/app-full-debug.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xeno-candy-full-port-debug
          path: app/build/outputs/apk/full/debug/app-full-debug.apk
          if-no-files-found: error
          retention-days: 7
