name: Xeno Android Build

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [feature/xeno-candy-browser-reset]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out Xeno
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: platform-tools

      - name: Install Android SDK 37.1
        run: sdkmanager "platforms;android-37.1"

      - name: Run upstream unit tests
        run: ./gradlew testFullDebugUnitTest --no-daemon --stacktrace

      - name: Run Android lint
        run: ./gradlew lintFullDebug --no-daemon --stacktrace

      - name: Build installable Android APK
        run: ./gradlew assembleFullDebug --no-daemon --stacktrace

      - name: Verify APK output
        run: test -s app/build/outputs/apk/full/debug/app-full-debug.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xeno-candy-full-debug
          path: app/build/outputs/apk/full/debug/app-full-debug.apk
          if-no-files-found: error
          retention-days: 7
