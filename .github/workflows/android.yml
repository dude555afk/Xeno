name: Android Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_COMPILE_SDK: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          set -eux
          SDK_DIR="${ANDROID_HOME:-$HOME/android-sdk}"
          mkdir -p "$SDK_DIR/cmdline-tools"

          if [ ! -d "$SDK_DIR/cmdline-tools/latest" ]; then
            curl -sSLo /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            mv /tmp/cmdtools/cmdline-tools "$SDK_DIR/cmdline-tools/latest"
          fi

          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Room schema directory
        run: mkdir -p app/schemas

      - name: Build debug APK
        id: assemble
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace --info > build-output.log 2>&1
          echo "EXIT_CODE=$?" >> "$GITHUB_OUTPUT"

      # Run #51's build reported success yet the artifact step found no APK at
      # app/build/outputs/apk/debug/*.apk. Without this the only way to find out
      # where the file actually went was to read the log, which the API refuses
      # to serve. So print it.
      - name: Locate built APK
        run: |
          echo "=== find *.apk ==="
          find . -name "*.apk" -not -path "./.git/*" 2>/dev/null || echo "(none)"
          echo "=== find **/outputs ==="
          find . -type d -name outputs -not -path "./.git/*" 2>/dev/null || echo "(none)"
          echo "=== build dir listing ==="
          ls -la app/build/outputs/apk/ 2>/dev/null || echo "(no app/build/outputs/apk)"
          echo "=== build-output.log tail ==="
          tail -n 40 build-output.log

      - name: Fail the job if the build failed
        if: steps.assemble.outputs.EXIT_CODE != '0'
        run: |
          echo "::error::gradle assembleDebug exited with code ${{ steps.assemble.outputs.EXIT_CODE }}"
          tail -n 200 build-output.log
          exit 1

      - name: Upload debug APK
        if: steps.assemble.outputs.EXIT_CODE == '0'
        uses: actions/upload-artifact@v4
        with:
          name: xeno-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish build log
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f build-output.log
          git diff --cached --quiet || git commit -m "ci: build log (exit=${{ steps.assemble.outputs.EXIT_CODE }})"
          git push origin HEAD:ci-logs || echo "log push failed; log remains local to the run"

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: xeno-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
